<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Go Live - Compartilhe sua câmera ou tela no Discord">
    <title>Go Live - Câmera & Tela</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0d0d1f 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            height: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            padding: 12px 0;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 4px;
            background: linear-gradient(90deg, #b7d215, #e7ee48);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 500;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 16px;
            flex: 1;
            overflow: hidden;
        }

        /* VIDEO SECTION */
        .video-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }

        .video-container {
            flex: 1;
            background: #0a0a14;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            min-height: 300px;
        }

        #videoStream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            background: #000;
            image-rendering: crisp-edges;
        }

        .video-placeholder {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }

        .video-placeholder svg {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            opacity: 0.3;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .video-info {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            display: none;
            gap: 6px;
            align-items: center;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .live-badge {
            width: 8px;
            height: 8px;
            background: #ff4444;
            border-radius: 50%;
            animation: pulse-live 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-live {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .video-stats {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            display: none;
            gap: 8px;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .stat-dot {
            width: 6px;
            height: 6px;
            background: #4ade80;
            border-radius: 50%;
        }

        /* CONTROLS */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            will-change: transform, box-shadow;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #b7d215 0%, #d2e51a 100%);
            color: #000;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(183, 210, 21, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(183, 210, 21, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.5);
            display: none;
        }

        .btn-danger:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.3);
            border-color: rgba(239, 68, 68, 0.7);
        }

        /* SETTINGS PANEL */
        .settings-panel {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 100%;
        }

        .settings-panel::-webkit-scrollbar {
            width: 6px;
        }

        .settings-panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .settings-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .settings-panel::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .panel-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
        }

        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .group-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.5);
        }

        .source-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .source-btn {
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .source-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .source-btn.active {
            background: rgba(183, 210, 21, 0.15);
            border-color: rgba(183, 210, 21, 0.4);
            color: #b7d215;
            font-weight: 700;
        }

        select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        select option {
            background: #0a0a14;
            color: #fff;
        }

        .toggle-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .toggle-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #b7d215;
        }

        .status {
            padding: 10px 12px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            font-size: 11px;
            color: rgba(147, 197, 253, 0.8);
            text-align: center;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .status.recording {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: rgba(252, 165, 165, 0.8);
        }

        .status.success {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.3);
            color: rgba(134, 239, 172, 0.8);
        }

        .status.error {
            background: rgba(249, 115, 22, 0.1);
            border-color: rgba(249, 115, 22, 0.3);
            color: rgba(254, 209, 118, 0.8);
        }

        .browser-info {
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 11px;
            color: rgba(134, 239, 172, 0.7);
            line-height: 1.4;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .settings-panel {
                max-height: 200px;
            }

            .controls {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }

            .container {
                max-height: 100vh;
                padding: 0;
            }

            body {
                padding: 0;
            }

            .settings-panel {
                padding: 12px;
            }

            .btn {
                padding: 12px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎬 GO LIVE</h1>
            <p>Câmera & Tela - Compatível com Chrome & Brave</p>
        </div>

        <!-- Main Content -->
        <div class="main-grid">
            <!-- Video Section -->
            <div class="video-section">
                <div class="video-container">
                    <video id="videoStream" playsinline autoplay muted></video>
                    <div class="video-info">
                        <div class="live-badge"></div>
                        <span>AO VIVO</span>
                        <span id="qualityDisplay">1080p</span>
                        <span id="fpsDisplay">60 FPS</span>
                    </div>
                    <div class="video-stats">
                        <div class="stat">
                            <div class="stat-dot"></div>
                            <span id="statsDisplay">Conectado</span>
                        </div>
                    </div>
                    <div class="video-placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M23 7l-7 5 7 5V7z"/>
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                        </svg>
                        <div>Clique em "Iniciar" para começar a transmitir</div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="controls">
                    <button class="btn btn-primary" id="startBtn" onclick="startBroadcast()">
                        ▶ INICIAR
                    </button>
                    <button class="btn btn-danger" id="stopBtn" onclick="stopBroadcast()">
                        ⏹ PARAR
                    </button>
                </div>
            </div>

            <!-- Settings Panel -->
            <div class="settings-panel">
                <div class="panel-title">⚙️ Configurações</div>

                <!-- Source Selection -->
                <div class="settings-group">
                    <div class="group-label">Fonte</div>
                    <div class="source-options">
                        <button class="source-btn active" onclick="setSource('camera')" id="sourceCamera">
                            📷 Câmera
                        </button>
                        <button class="source-btn" onclick="setSource('screen')" id="sourceScreen">
                            🖥️ Tela Inteira
                        </button>
                        <button class="source-btn" onclick="setSource('window')" id="sourceWindow">
                            📱 Janela
                        </button>
                    </div>
                </div>

                <!-- Quality Selection -->
                <div class="settings-group">
                    <div class="group-label">Qualidade</div>
                    <select id="qualitySelect" onchange="updateQuality()">
                        <option value="low">720p (Conexão fraca)</option>
                        <option value="medium" selected>1080p (Recomendado)</option>
                        <option value="high">1440p (Alta)</option>
                        <option value="ultra">2K (Ultra)</option>
                    </select>
                </div>

                <!-- FPS Selection -->
                <div class="settings-group">
                    <div class="group-label">Quadros por segundo</div>
                    <select id="fpsSelect" onchange="updateFps()">
                        <option value="15">15 FPS</option>
                        <option value="30">30 FPS</option>
                        <option value="60" selected>60 FPS</option>
                    </select>
                </div>

                <!-- Toggles -->
                <div class="toggle-group">
                    <div class="toggle-item">
                        <label>🎙️ Microfone</label>
                        <input type="checkbox" id="micToggle" onchange="toggleMic()" checked>
                    </div>
                    <div class="toggle-item">
                        <label>🔊 Áudio da tela</label>
                        <input type="checkbox" id="audioToggle" onchange="toggleAudio()" checked>
                    </div>
                </div>

                <!-- Status -->
                <div class="status" id="status">
                    ✅ Pronto
                </div>

                <!-- Browser Info -->
                <div class="browser-info">
                    ✓ Otimizado para Chrome & Brave
                    <br>
                    <span id="browserInfo"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let mediaStream = null;
        let currentSource = 'camera';
        let isRecording = false;
        let recordingStartTime = null;

        const videoElement = document.getElementById('videoStream');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');

        // Detect Browser
        function detectBrowser() {
            const userAgent = navigator.userAgent;
            const isChrome = /Chrome/.test(userAgent) && /Google Inc/.test(navigator.vendor);
            const isBrave = /Brave/.test(userAgent);
            
            let browserName = 'Chrome/Brave';
            if (isBrave) browserName = 'Brave';
            if (isChrome) browserName = 'Chrome';
            
            const browserInfo = document.getElementById('browserInfo');
            browserInfo.textContent = `${browserName} ${navigator.userAgentData?.brands?.[0]?.version || ''}`.trim();
            
            // Check for required APIs
            if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                updateStatus('❌ Seu navegador não suporta captura de tela', 'error');
                startBtn.disabled = true;
            }
        }

        // Update Quality Display
        function updateQuality() {
            const quality = document.getElementById('qualitySelect').value;
            const qualityMap = {
                'low': '720p',
                'medium': '1080p',
                'high': '1440p',
                'ultra': '2K'
            };
            document.getElementById('qualityDisplay').textContent = qualityMap[quality];
            
            // Se está gravando, atualizar qualidade
            if (isRecording) {
                stopBroadcast();
                setTimeout(() => {
                    updateStatus('Qualidade alterada. Inicie novamente.', 'warning');
                }, 500);
            }
        }

        // Update FPS Display
        function updateFps() {
            const fps = document.getElementById('fpsSelect').value;
            document.getElementById('fpsDisplay').textContent = fps + ' FPS';
            
            if (isRecording) {
                stopBroadcast();
                setTimeout(() => {
                    updateStatus('FPS alterado. Inicie novamente.', 'warning');
                }, 500);
            }
        }

        // Get Video Constraints based on quality
        function getVideoConstraints() {
            const quality = document.getElementById('qualitySelect').value;
            const fps = parseInt(document.getElementById('fpsSelect').value);

            const constraints = {
                camera: {
                    low: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: fps } },
                    medium: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: fps } },
                    high: { width: { ideal: 2560 }, height: { ideal: 1440 }, frameRate: { ideal: fps } },
                    ultra: { width: { ideal: 3840 }, height: { ideal: 2160 }, frameRate: { ideal: fps } }
                },
                screen: {
                    low: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: fps }, cursor: 'always' },
                    medium: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: fps }, cursor: 'always' },
                    high: { width: { ideal: 2560 }, height: { ideal: 1440 }, frameRate: { ideal: fps }, cursor: 'always' },
                    ultra: { width: { ideal: 3840 }, height: { ideal: 2160 }, frameRate: { ideal: fps }, cursor: 'always' }
                }
            };

            return constraints[currentSource === 'camera' ? 'camera' : 'screen'][quality];
        }

        // Start Broadcasting
        async function startBroadcast() {
            try {
                updateStatus('⏳ Conectando...', 'info');
                startBtn.disabled = true;

                let stream = null;
                const constraints = {
                    video: getVideoConstraints(),
                    audio: true
                };

                try {
                    if (currentSource === 'camera') {
                        stream = await navigator.mediaDevices.getUserMedia(constraints);
                    } else {
                        // Para tela, usar getDisplayMedia com audio options
                        stream = await navigator.mediaDevices.getDisplayMedia({
                            video: constraints.video,
                            audio: {
                                echoCancellation: true,
                                noiseSuppression: true,
                                autoGainControl: true
                            }
                        });
                    }
                } catch (err) {
                    if (err.name === 'NotAllowedError') {
                        updateStatus('❌ Você cancelou o acesso', 'error');
                    } else if (err.name === 'NotFoundError') {
                        updateStatus('❌ Nenhuma câmera/tela encontrada', 'error');
                    } else {
                        throw err;
                    }
                    startBtn.disabled = false;
                    return;
                }

                mediaStream = stream;
                videoElement.srcObject = stream;
                videoElement.style.display = 'block';

                document.querySelector('.video-placeholder').style.display = 'none';
                document.querySelector('.video-info').style.display = 'flex';
                document.querySelector('.video-stats').style.display = 'flex';

                isRecording = true;
                recordingStartTime = Date.now();
                startBtn.style.display = 'none';
                stopBtn.style.display = 'flex';

                updateStatus('🔴 TRANSMISSÃO ATIVA', 'recording');

                // Monitorar stream
                stream.getTracks().forEach(track => {
                    track.onended = () => {
                        if (isRecording) stopBroadcast();
                    };
                });

                // Update stats
                updateStats();

            } catch (error) {
                console.error('Erro ao iniciar:', error);
                updateStatus(`❌ ${error.message}`, 'error');
                startBtn.disabled = false;
            }
        }

        // Stop Broadcasting
        function stopBroadcast() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            videoElement.srcObject = null;
            videoElement.style.display = 'none';

            document.querySelector('.video-placeholder').style.display = 'block';
            document.querySelector('.video-info').style.display = 'none';
            document.querySelector('.video-stats').style.display = 'none';

            isRecording = false;
            startBtn.style.display = 'flex';
            stopBtn.style.display = 'none';

            const duration = recordingStartTime ? Math.round((Date.now() - recordingStartTime) / 1000) : 0;
            updateStatus(`✅ Transmissão encerrada (${duration}s)`, 'success');
        }

        // Update Statistics
        function updateStats() {
            if (!isRecording || !mediaStream) return;

            const duration = Math.round((Date.now() - recordingStartTime) / 1000);
            const minutes = Math.floor(duration / 60);
            const seconds = duration % 60;
            const timeStr = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            document.getElementById('statsDisplay').textContent = timeStr;

            setTimeout(updateStats, 1000);
        }

        // Set Source
        function setSource(source) {
            if (isRecording) {
                stopBroadcast();
                setTimeout(() => updateStatus('Fonte alterada. Inicie novamente.', 'warning'), 500);
            }

            currentSource = source;
            
            document.querySelectorAll('.source-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`source${source.charAt(0).toUpperCase() + source.slice(1)}`).classList.add('active');
        }

        // Toggle Microphone
        function toggleMic() {
            const enabled = document.getElementById('micToggle').checked;
            if (mediaStream) {
                mediaStream.getAudioTracks().forEach(track => {
                    track.enabled = enabled;
                });
            }
        }

        // Toggle Audio
        function toggleAudio() {
            const enabled = document.getElementById('audioToggle').checked;
            if (mediaStream) {
                mediaStream.getAudioTracks().forEach(track => {
                    track.enabled = enabled;
                });
            }
        }

        // Update Status Message
        function updateStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type === 'recording' ? 'recording' : type === 'success' ? 'success' : type === 'error' ? 'error' : ''}`;
        }

        // Request persistent permissions (Chrome/Brave)
        async function requestPersistentPermissions() {
            try {
                if (navigator.permissions && navigator.permissions.query) {
                    const cameraPermission = await navigator.permissions.query({ name: 'camera' });
                    const microphonePermission = await navigator.permissions.query({ name: 'microphone' });
                    
                    console.log('Camera:', cameraPermission.state);
                    console.log('Microphone:', microphonePermission.state);
                }
            } catch (error) {
                console.log('Persistent permissions não disponíveis', error.message);
            }
        }

        // Initialize
        window.addEventListener('load', () => {
            detectBrowser();
            requestPersistentPermissions();
            updateStatus('✅ Pronto para transmitir', 'success');
        });

        // Cleanup on exit
        window.addEventListener('beforeunload', () => {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
        });

        // Prevent accidental navigation
        window.addEventListener('unload', () => {
            if (isRecording) {
                stopBroadcast();
            }
        });

        // Handle page visibility
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isRecording) {
                console.warn('Aba em background. Stream pausado.');
            } else if (!document.hidden && isRecording) {
                console.log('Aba ativa novamente.');
            }
        });
    </script>
</body>
</html>
